<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Debugger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>$ api-debugger</h1>
  </header>

  <main>
    <form id="request-form">
      <div class="row">
        <select id="method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="PATCH">PATCH</option>
          <option value="DELETE">DELETE</option>
        </select>
        <input type="text" id="url" placeholder="https://api.example.com/endpoint">
        <button type="submit">Send</button>
        <button type="button" id="copy-curl">Copy as cURL</button>
        <button type="button" id="retry-btn" disabled>Retry last</button>
        <button type="button" id="save-favorite-btn">☆ Save</button>
      </div>

      <div class="section">
        <div class="section-label">Query Params</div>
        <div id="params-list"></div>
        <button type="button" id="add-param">+ Add param</button>
      </div>

      <div class="section">
        <div class="section-label">Headers</div>
        <div id="headers-list">
          <div class="header-row">
            <input type="text" class="header-key" placeholder="Key">
            <input type="text" class="header-value" placeholder="Value">
          </div>
        </div>
        <button type="button" id="add-header">+ Add header</button>
      </div>

      <div class="section">
        <div class="section-label">Body</div>
        <textarea id="request-body" placeholder='{ "example": "value" }'></textarea>
      </div>
    </form>

    <div class="section">
      <details id="history-section">
        <summary class="section-label">History</summary>
        <div id="history-list"></div>
        <button type="button" id="clear-history">Clear history</button>
      </details>
    </div>

    <div class="section">
      <details id="favorites-section">
        <summary class="section-label">Favorites</summary>
        <div id="favorites-list"></div>
      </details>
    </div>

    <section id="response-panel">
      <!-- response will be rendered here in step 3 -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
